[package]
name = "agent-passport-system"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Verification-first Rust implementation of Agent Passport System (APS) artifact verifiers"

[lib]
name = "agent_passport"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["parsing", "formatting"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
thiserror = "2.0"
